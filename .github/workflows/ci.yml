name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        working-directory: backend
        # The encoders in requirements-dev pull ~2.5 GB of torch and are not
        # needed: retrieval falls back to lexical, which every test covers.
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio ruff

      - name: Migrations apply cleanly and match the models
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Lint
        working-directory: backend
        run: python -m ruff check --select F,E9 app tests scripts

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
